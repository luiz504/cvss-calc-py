[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyt-cvss"
version = "1.1.1"
description = "CVSS v3.1 base score calculator for the terminal"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
cvss = "cvss.app:run"

[tool.setuptools]
packages = ["cvss"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]


[tool.pytest.ini_options]
addopts = "-v -s"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.data-files]
"share/man/man1" = ["man/cvss.1"]
